services:
  # ----------------------------------------------------
  # 0. Redis (Cache + Message Broker)
  # ----------------------------------------------------
  - type: redis
    name: revenueguard-redis
    ipAllowList: [] # Internal only
    plan: starter

  # ----------------------------------------------------
  # 1. FastAPI Web Service (Agent API)
  # ----------------------------------------------------
  - type: web
    name: revenueguard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: revenueguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: revenueguard-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: revenueguard-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: revenueguard-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ----------------------------------------------------
  # 2. Celery Worker (Background Agent Execution)
  # ----------------------------------------------------
  - type: worker
    name: revenueguard-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A src.workers.celery_app worker --loglevel=info
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: revenueguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: revenueguard-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: revenueguard-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: revenueguard-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ----------------------------------------------------
  # 3. Next.js Dashboard
  # ----------------------------------------------------
  - type: web
    name: revenueguard-dashboard
    runtime: node
    rootDir: dashboard
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: revenueguard-api
          property: hostport

# ----------------------------------------------------
# Managed Databases
# ----------------------------------------------------
databases:
  - name: revenueguard-db
    databaseName: revenueguard
    user: postgres
    plan: starter
