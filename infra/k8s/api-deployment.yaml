apiVersion: apps/v1
kind: Deployment
metadata:
  name: revenueguard-api
  labels:
    app: revenueguard
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: revenueguard
      component: api
  template:
    metadata:
      labels:
        app: revenueguard
        component: api
    spec:
      containers:
        - name: api
          image: revenueguard:latest
          ports:
            - containerPort: 8000
          command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - secretRef:
                name: revenueguard-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: revenueguard-api
spec:
  selector:
    app: revenueguard
    component: api
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
