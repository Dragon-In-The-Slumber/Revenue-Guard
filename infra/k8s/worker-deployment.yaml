apiVersion: apps/v1
kind: Deployment
metadata:
  name: revenueguard-worker
  labels:
    app: revenueguard
    component: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: revenueguard
      component: worker
  template:
    metadata:
      labels:
        app: revenueguard
        component: worker
    spec:
      containers:
        - name: worker
          image: revenueguard:latest
          command: ["celery", "-A", "src.workers.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - secretRef:
                name: revenueguard-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: revenueguard-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: revenueguard-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
